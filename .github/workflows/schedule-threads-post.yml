name: Publish Threads (Cron)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install requests

      - name: Publication sur Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python publish_threads.py

      - name: Alerte email si échec
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "🔴 Bot Threads — Publication échouée"
          to: ${{ secrets.ALERT_EMAIL }}
          from: ${{ secrets.ALERT_EMAIL }}
          body: |
            Ton bot Threads a échoué lors de la publication.
            
            Vérifie les logs ici :
            https://github.com/Feran-max/bible-study-threads/actions
            
            Causes possibles :
            - Token Threads expiré
            - Groq API down
            - Erreur dans le script
