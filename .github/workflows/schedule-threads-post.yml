name: Publish Threads (Cron)

on:
  schedule:
    - cron: "0 12 * * *"   # 8h AM EST  — Morning devotion
    - cron: "0 17 * * *"   # 1h PM EST  — Lunch engagement
    - cron: "0 22 * * *"   # 6h PM EST  — Evening story
    - cron: "0 2 * * *"    # 10h PM EST — Night CTA
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dependances
        run: pip install requests

      - name: Publication sur Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python publish_threads.py
