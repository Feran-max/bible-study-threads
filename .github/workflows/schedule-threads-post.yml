name: Publish Threads (Cron)

on:
  schedule:
    # Exécute chaque jour à 08h00 UTC (ajuste selon ton fuseau horaire)
    - cron: "0 8 * * *"
  workflow_dispatch: # Permet aussi le déclenchement manuel depuis l'UI GitHub

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt

      - name: Lancer le script de publication
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          python publish_threads.py
