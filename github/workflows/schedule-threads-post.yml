1 name: Schedule Threads Post
  
     on:
      schedule:
      - cron: '0 */7 * * *'
      workflow_dispatch:
    
  jobs:
   publish-post:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout repository
        uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v5
           with:
              python-version: '3.x'
        - name: Install dependencies
        run: pip install requests
     - name: Run Threads Publisher Script
      run: python publish_threads.py
         env:
          ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
            THREADS_USER_ID: '37008471638752388'
         GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

